<html lang="zh">
<head>
    <meta charset="UTF-8" />

    <title>省市区县 · 三级联动</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f2f7fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25);
            padding: 28px 24px 32px;
            transition: 0.2s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px 20px;
            border-bottom: 2px solid #e6edf5;
            padding-bottom: 18px;
            margin-bottom: 22px;
        }
        .header h1 {
            font-size: 1.9rem;
            font-weight: 650;
            color: #0b2b4a;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #3e5e7e;
            background: #eef4fa;
            padding: 4px 16px;
            border-radius: 40px;
        }
        .filter-area {
            display: flex;
            align-items: center;
            gap: 12px 16px;
            flex-wrap: wrap;
            background: #f5faff;
            padding: 8px 20px 8px 20px;
            border-radius: 60px;
            border: 1px solid #dce6f0;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px 10px;
            flex-wrap: wrap;
            position: relative;
        }
        .filter-group label {
            font-weight: 500;
            color: #1f3f5c;
            font-size: 0.95rem;
            white-space: nowrap;
        }
        .search-select-wrapper {
            position: relative;
            min-width: 150px;
            display: flex;
            align-items: center;
        }
        .search-select-wrapper input {
            padding: 7px 30px 7px 14px;
            border-radius: 40px;
            border: 1px solid #cbd8e8;
            background: white;
            font-size: 0.95rem;
            color: #0b2b4a;
            outline: none;
            width: 100%;
            min-width: 130px;
            transition: 0.15s;
            cursor: text;
        }
        .search-select-wrapper input:hover {
            border-color: #8aa3c0;
        }
        .search-select-wrapper input:focus {
            border-color: #1f6bb0;
            box-shadow: 0 0 0 3px rgba(31, 107, 176, 0.15);
        }
        .search-select-wrapper input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f0f4fa;
        }
        .search-select-wrapper .clear-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: none;
            background: #d0d9e6;
            color: #4a5f7a;
            font-size: 14px;
            line-height: 20px;
            text-align: center;
            cursor: pointer;
            display: none;
            transition: 0.15s;
            padding: 0;
            font-weight: 600;
        }
        .search-select-wrapper .clear-btn:hover {
            background: #b0c0d4;
            color: #1a2f4a;
        }
        .search-select-wrapper .clear-btn.visible {
            display: block;
        }
        .search-select-wrapper .clear-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .search-select-wrapper .dropdown-list {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #cbd8e8;
            border-radius: 16px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            padding: 6px 0;
        }
        .search-select-wrapper .dropdown-list.show {
            display: block;
        }
        .search-select-wrapper .dropdown-list .option-item {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.92rem;
            color: #1d334a;
            transition: background 0.1s;
        }
        .search-select-wrapper .dropdown-list .option-item:hover {
            background: #eaf1fa;
        }
        .search-select-wrapper .dropdown-list .option-item.active {
            background: #d4e2f5;
        }
        .search-select-wrapper .dropdown-list .option-item.no-match {
            color: #8a9db0;
            cursor: default;
            font-style: italic;
        }
        .search-select-wrapper .dropdown-list .option-item.no-match:hover {
            background: transparent;
        }
        .reset-btn {
            background: transparent;
            border: 1px solid #cbd8e8;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #1f3f5c;
            cursor: pointer;
            transition: 0.15s;
            background: white;
            font-weight: 450;
        }
        .reset-btn:hover {
            background: #eaf1fa;
            border-color: #8aa3c0;
        }
        .table-wrap {
            overflow-x: auto;
            border-radius: 18px;
            border: 1px solid #e2eaf3;
            background: white;
            margin-top: 6px;
        }
        table {
            width: 1200px;
            border-collapse: collapse;
            font-size: 0.95rem;
            table-layout: fixed;
        }
        th {
            background: #f0f6fd;
            color: #1b3650;
            font-weight: 600;
            padding: 16px 14px;
            text-align: left;
            border-bottom: 2px solid #d3dfea;
        }
        td {
            padding: 14px 14px;
            border-bottom: 1px solid #e8eef6;
            color: #1d334a;
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .col-seq {
            width: 70px;
            text-align: center;
            color: #4d627c;
            font-weight: 500;
            background: #fafdff;
        }
        .col-city {
            width: 160px;
            font-weight: 500;
        }
        .col-district {
            width: 220px;
        }
        .col-code {
            width: 180px;
            font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
            letter-spacing: 0.2px;
            color: #1f4a7a;
            font-weight: 500;
        }
        .empty-row td {
            text-align: center;
            color: #6f8aa8;
            padding: 40px 10px;
            font-style: italic;
        }
        tbody tr:hover td {
            background-color: #f4faff;
        }
        .footer-note {
            margin-top: 22px;
            display: flex;
            justify-content: flex-end;
            gap: 18px;
            font-size: 0.85rem;
            color: #4f6885;
            border-top: 1px solid #e3ebf3;
            padding-top: 18px;
            flex-wrap: wrap;
        }
        .footer-note span {
            background: #f0f6fc;
            padding: 4px 18px;
            border-radius: 40px;
        }
        @media (max-width: 820px) {
            .container {
                padding: 18px 12px;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .filter-area {
                padding: 10px 14px;
                border-radius: 32px;
                width: 100%;
            }
            .search-select-wrapper {
                min-width: 100px;
                flex: 1;
            }
            .search-select-wrapper input {
                min-width: 80px;
                padding-right: 28px;
            }
            table {
                width: 100%;
                min-width: 480px;
            }
            td, th {
                padding: 11px 8px;
                font-size: 0.88rem;
            }
            .col-seq {
                width: 50px;
            }
            .col-city {
                width: 120px;
            }
            .col-district {
                width: 160px;
            }
            .col-code {
                width: 130px;
            }
        }
    </style>
</head>

<div class="container" id="app">

        <div class="filter-area">

            <div class="filter-group">

                    <button class="clear-btn" id="cityClearBtn" title="清除内容">×</button>
                    <div class="dropdown-list" id="cityDropdown"></div>
                </div>
            </div>
            <div class="filter-group">
                <label>区县</label>
                <div class="search-select-wrapper" id="districtWrapper">

                    <div class="dropdown-list" id="districtDropdown"></div>
                </div>
            </div>
            <button class="reset-btn" id="resetBtn">↺ 重置</button>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>

            <tbody id="tableBody">

        </table>
    </div>
    <div class="footer-note">
        <span>🏷️ 共 <span id="totalCount">0</span> 个区县</span>
    </div>
</div>

        // ------------------------------------------------------------
        // DOM 引用
        var provinceSelect = document.getElementById('provinceSelect');
        var cityInput = document.getElementById('cityInput');
        var cityDropdown = document.getElementById('cityDropdown');
        var cityClearBtn = document.getElementById('cityClearBtn');
        var districtInput = document.getElementById('districtInput');
        var districtDropdown = document.getElementById('districtDropdown');
        var districtClearBtn = document.getElementById('districtClearBtn');
        var resetBtn = document.getElementById('resetBtn');
        var tbody = document.getElementById('tableBody');
        var totalSpan = document.getElementById('totalCount');

        // 状态
        var currentProvince = '四川省';
        var currentCity = '';
        var currentDistrict = '';

        // 所有城市列表（缓存）
        var allCities = [];
        // 当前城市对应的区县列表（缓存）
        var currentDistricts = [];

        // ------------------------------------------------------------
        // 工具函数
        function getCities(province) {
            var citySet = {};
            var result = [];
            rawData.forEach(function(item) {
                if (item.province === province) {
                    citySet[item.city] = true;
                }
            });
            for (var key in citySet) {
                if (citySet.hasOwnProperty(key)) {
                    result.push(key);
                }
            }
            return result;
        }

        function getDistricts(province, city) {
            var result = [];
            rawData.forEach(function(item) {
                if (item.province === province && item.city === city) {
                    result.push(item);
                }
            });
            return result;
        }

        // ------------------------------------------------------------
        // 清除按钮显示控制
        function updateClearBtnVisibility(input, clearBtn) {
            if (input.value && input.value.trim() !== '' && !input.disabled) {
                clearBtn.classList.add('visible');
            } else {
                clearBtn.classList.remove('visible');
            }
        }

        // ------------------------------------------------------------
        // 渲染下拉选项
        function renderCityDropdown(filterText) {
            var keyword = filterText ? filterText.trim() : '';
            var matched = allCities;
            if (keyword) {
                matched = allCities.filter(function(c) { return c.indexOf(keyword) !== -1; });
            }

            cityDropdown.innerHTML = '';
            if (matched.length === 0) {
                var div = document.createElement('div');
                div.className = 'option-item no-match';
                div.textContent = '无匹配城市';
                cityDropdown.appendChild(div);
            } else {
                matched.forEach(function(city) {
                    var div = document.createElement('div');
                    div.className = 'option-item';
                    div.textContent = city;
                    div.setAttribute('data-value', city);
                    div.addEventListener('click', function() {
                        selectCity(city);
                    });
                    cityDropdown.appendChild(div);
                });
            }
            cityDropdown.classList.add('show');
        }

        function renderDistrictDropdown(filterText) {
            var keyword = filterText ? filterText.trim() : '';
            var matched = currentDistricts;
            if (keyword) {
                matched = currentDistricts.filter(function(d) { return d.district.indexOf(keyword) !== -1; });
            }

            districtDropdown.innerHTML = '';
            if (matched.length === 0) {
                var div = document.createElement('div');
                div.className = 'option-item no-match';
                div.textContent = '无匹配区县';
                districtDropdown.appendChild(div);
            } else {
                matched.forEach(function(item) {
                    var div = document.createElement('div');
                    div.className = 'option-item';
                    div.textContent = item.district;
                    div.setAttribute('data-value', item.district);
                    div.addEventListener('click', function() {
                        selectDistrict(item.district);
                    });
                    districtDropdown.appendChild(div);
                });
            }
            districtDropdown.classList.add('show');
        }

        // ------------------------------------------------------------
        // 选择城市
        function selectCity(city) {
            currentCity = city;
            cityInput.value = city;
            cityDropdown.classList.remove('show');
            updateClearBtnVisibility(cityInput, cityClearBtn);

            // 更新区县列表
            currentDistricts = getDistricts(currentProvince, city);
            currentDistrict = '';
            districtInput.value = '';
            districtInput.disabled = false;
            updateClearBtnVisibility(districtInput, districtClearBtn);
            renderDistrictDropdown('');

            renderTable();
        }

        // ------------------------------------------------------------
        // 选择区县
        function selectDistrict(district) {
            currentDistrict = district;
            districtInput.value = district;
            districtDropdown.classList.remove('show');
            updateClearBtnVisibility(districtInput, districtClearBtn);
            renderTable();
        }

        // ------------------------------------------------------------
        // 清除城市
        function clearCity() {
            currentCity = '';
            cityInput.value = '';
            cityDropdown.classList.remove('show');
            updateClearBtnVisibility(cityInput, cityClearBtn);
            // 清空区县
            currentDistricts = [];
            currentDistrict = '';
            districtInput.value = '';
            districtInput.disabled = true;
            updateClearBtnVisibility(districtInput, districtClearBtn);
            districtDropdown.classList.remove('show');
            renderTable();
        }

        // ------------------------------------------------------------
        // 清除区县
        function clearDistrict() {
            currentDistrict = '';
            districtInput.value = '';
            districtDropdown.classList.remove('show');
            updateClearBtnVisibility(districtInput, districtClearBtn);
            renderTable();
        }

        // ------------------------------------------------------------
        // 渲染表格（只有市选中时才显示数据）
        function renderTable() {
            var province = currentProvince;
            var city = currentCity;
            var district = currentDistrict;

            var filtered = [];
            if (province && city && district) {
                filtered = rawData.filter(function(item) {
                    return item.province === province && item.city === city && item.district === district;
                });
            } else if (province && city) {
                filtered = rawData.filter(function(item) {
                    return item.province === province && item.city === city;
                });
            } else {
                filtered = [];
            }

            var html = '';
            if (filtered.length === 0) {
                html = '<tr class="empty-row"><td colspan="4">📍 请选择市、区县进行筛选</td></tr>';
            } else {
                filtered.forEach(function(item, index) {
                    html += '<tr>' +
                        '<td class="col-seq">' + (index + 1) + '</td>' +
                        '<td class="col-city">' + item.city + '</td>' +
                        '<td class="col-district">' + item.district + '</td>' +
                        '<td class="col-code">' + item.code + '</td>' +
                        '</tr>';
                });
            }
            tbody.innerHTML = html;
            totalSpan.textContent = filtered.length;
        }

        // ------------------------------------------------------------
        // 清空城市和区县
        function clearCityAndDistrict() {
            currentCity = '';
            cityInput.value = '';
            cityInput.disabled = true;
            updateClearBtnVisibility(cityInput, cityClearBtn);
            currentDistricts = [];
            currentDistrict = '';
            districtInput.value = '';
            districtInput.disabled = true;
            updateClearBtnVisibility(districtInput, districtClearBtn);
            districtDropdown.classList.remove('show');
            cityDropdown.classList.remove('show');
        }

        // ------------------------------------------------------------
        // 初始化城市列表（省默认选中，但市和区县为空）
        function initCityList(province) {
            currentProvince = province;
            allCities = getCities(province);
            cityInput.disabled = false;
            cityInput.value = '';
            currentCity = '';
            updateClearBtnVisibility(cityInput, cityClearBtn);
            currentDistricts = [];
            currentDistrict = '';
            districtInput.value = '';
            districtInput.disabled = true;
            updateClearBtnVisibility(districtInput, districtClearBtn);
            cityDropdown.classList.remove('show');
            districtDropdown.classList.remove('show');
            renderTable();
        }

        // ------------------------------------------------------------
        // 事件绑定：城市清除按钮
        cityClearBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            clearCity();
            cityInput.focus();
        });

        // ------------------------------------------------------------
        // 事件绑定：区县清除按钮
        districtClearBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            clearDistrict();
            districtInput.focus();
        });

        // ------------------------------------------------------------
        // 事件绑定：城市输入框
        cityInput.addEventListener('input', function() {
            var val = this.value;
            updateClearBtnVisibility(this, cityClearBtn);
            if (currentProvince) {
                renderCityDropdown(val);
            }
        });

        cityInput.addEventListener('focus', function() {
            if (!cityInput.disabled && currentProvince) {
                renderCityDropdown(this.value);
            }
        });

        // 点击外部关闭下拉
        document.addEventListener('click', function(e) {
            var wrapper = document.getElementById('cityWrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                cityDropdown.classList.remove('show');
            }
            var wrapper2 = document.getElementById('districtWrapper');
            if (wrapper2 && !wrapper2.contains(e.target)) {
                districtDropdown.classList.remove('show');
            }
        });

        // 城市键盘事件
        cityInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                var val = this.value.trim();
                if (val && allCities.indexOf(val) !== -1) {
                    selectCity(val);
                } else {
                    var matched = allCities.filter(function(c) { return c.indexOf(val) !== -1; });
                    if (matched.length > 0) {
                        selectCity(matched[0]);
                    }
                }
                e.preventDefault();
            }
            if (e.key === 'Escape') {
                cityDropdown.classList.remove('show');
                this.blur();
            }
        });

        // ------------------------------------------------------------
        // 事件绑定：区县输入框
        districtInput.addEventListener('input', function() {
            var val = this.value;
            updateClearBtnVisibility(this, districtClearBtn);
            if (currentProvince && currentCity) {
                renderDistrictDropdown(val);
            }
        });

        districtInput.addEventListener('focus', function() {
            if (!districtInput.disabled && currentProvince && currentCity) {
                renderDistrictDropdown(this.value);
            }
        });

        districtInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                var val = this.value.trim();
                if (val) {
                    var matched = currentDistricts.filter(function(d) { return d.district.indexOf(val) !== -1; });
                    if (matched.length > 0) {
                        selectDistrict(matched[0].district);
                    }
                }
                e.preventDefault();
            }
            if (e.key === 'Escape') {
                districtDropdown.classList.remove('show');
                this.blur();
            }
        });

        // ------------------------------------------------------------
        // 省份切换（目前只有四川省，但保留逻辑）
        provinceSelect.addEventListener('change', function() {
            var province = this.value;
            currentProvince = province;

            if (province) {
                allCities = getCities(province);
                cityInput.disabled = false;
                cityInput.value = '';
                currentCity = '';
                updateClearBtnVisibility(cityInput, cityClearBtn);
                currentDistricts = [];
                currentDistrict = '';
                districtInput.value = '';
                districtInput.disabled = true;
                updateClearBtnVisibility(districtInput, districtClearBtn);
                districtDropdown.classList.remove('show');
                renderTable();
            } else {
                allCities = [];
                clearCityAndDistrict();
                renderTable();
            }
            cityDropdown.classList.remove('show');
            districtDropdown.classList.remove('show');
        });

        // ------------------------------------------------------------
        // 重置按钮：清空市和区县，省保持不变（四川省）
        resetBtn.addEventListener('click', function() {
            provinceSelect.value = '四川省';
            currentProvince = '四川省';
            allCities = getCities('四川省');
            clearCityAndDistrict();
            cityInput.disabled = false;
            updateClearBtnVisibility(cityInput, cityClearBtn);
            cityDropdown.classList.remove('show');
            districtDropdown.classList.remove('show');
            renderTable();
        });

        // ------------------------------------------------------------
        // 初始化：省默认选中四川省，市和区县为空
        provinceSelect.value = '四川省';
        currentProvince = '四川省';
        allCities = getCities('四川省');
        cityInput.disabled = false;
        cityInput.value = '';
        currentCity = '';
        updateClearBtnVisibility(cityInput, cityClearBtn);
        districtInput.disabled = true;
        districtInput.value = '';
        updateClearBtnVisibility(districtInput, districtClearBtn);
        currentDistricts = [];
        currentDistrict = '';
        renderTable();

        console.log('✅ 省市区三级联动已启动，省默认选中四川省，带清除按钮');
    })();
