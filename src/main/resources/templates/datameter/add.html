<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="keywords" content="">
	<meta name="description" content="">
	<title>新增页面</title>


	<link href="/css/bootstrap.min.css" rel="stylesheet"/>
	<link href="/css/font-awesome.min.css" rel="stylesheet"/>
	<!-- bootstrap-table 表格插件样式 -->
	<link href="/ajax/libs/bootstrap-table/bootstrap-table.min.css" rel="stylesheet"/>
	<link  href="/css/animate.min.css" rel="stylesheet"/>
	<link  href="/css/style.min.css" rel="stylesheet"/>
	<link  href="/ruoyi/css/ry-ui.css" rel="stylesheet"/>
	<script  src="/js/jquery.min.js"></script>
	<script  src="/js/bootstrap.min.js"></script>
	<!-- bootstrap-table 表格插件 -->
	<script  src="/ajax/libs/bootstrap-table/bootstrap-table.min.js"></script>
	<script  src="/ajax/libs/bootstrap-table/locale/bootstrap-table-zh-CN.min.js"></script>
	<script  src="/ajax/libs/bootstrap-table/extensions/mobile/bootstrap-table-mobile.js"></script>
	<!-- jquery-validate 表单验证插件 -->
	<script  src="/ajax/libs/validate/jquery.validate.min.js"></script>
	<script  src="/ajax/libs/validate/jquery.validate.extend.js"></script>
	<script  src="/ajax/libs/validate/messages_zh.js"></script>
	<!-- bootstrap-table 表格树插件 -->
	<script  src="/ajax/libs/bootstrap-table/extensions/tree/bootstrap-table-tree.min.js"></script>
	<!-- 遮罩层 -->
	<script  src="/ajax/libs/blockUI/jquery.blockUI.js"></script>
	<script  src="/ajax/libs/iCheck/icheck.min.js"></script>
	<script  src="/ajax/libs/layer/layer.min.js"></script>
	<script  src="/ajax/libs/layui/layui.min.js"></script>
	<script  src="/ruoyi/js/common.js"></script>
	<script  src="/ruoyi/js/ry-ui.js"></script>
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-post-add">
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">单位名称：</label>
				<div class="col-sm-6">
					<input class="form-control" type="text" name="name" id="name" required>
				</div>
			</div>


			<div class="form-group">
				<label class="col-sm-3 control-label is-required">地区类型：</label>
				<div class="col-sm-6">
					<select name="type" class="form-control" required>
							<option value="">所有</option>
							<option text="" value=1 >绵阳</option>
							<option text="" value=2 >德阳</option>
							<option text="" value=3 >广元</option>
							<option text="" value=4 >乐山</option>
							<option text="" value=5 >自贡及其他</option>
							<option text="" value=6 >宜宾</option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">部署日期：</label>
				<div class="col-sm-6">
					<input type="text" class="time-input form-control" name="bsDate" id="bsDate" required placeholder="部署日期"/>
				</div>
			</div>

			<div class="form-group">
				<label class="col-sm-3 control-label">上线日期：</label>
				<div class="col-sm-6">
					<input type="text" class="time-input form-control" name="sxDate" id="sxDate"  placeholder="上线日期"/>
				</div>
			</div>

			<div class="form-group">
				<label class="col-sm-3 control-label is-required">版本号：</label>
				<div class="col-sm-6">
					<input class="form-control" type="text" name="version" id="version" required>
				</div>
			</div>

			<div class="form-group">
				<label class="col-sm-3 control-label is-required">负责人：</label>
				<div class="col-sm-6">
					<input class="form-control" type="text" name="concat" id="concat" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label ">签名信息：</label>
				<div class="col-sm-6">
					<input class="form-control" type="text" name="sign" id="sign">
				</div>
			</div>

			<div class="form-group">
				<label class="col-sm-3 control-label is-required">服务器资料信息：</label>
				<div class="col-sm-6">
					<textarea id="fuWuQi" name="fuWuQi"  class="form-control" required></textarea>
				</div>
			</div>
		</form>
	</div>
	<!--<div class="row">
		<div class="col-sm-offset-5 col-sm-10">
			<button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i>保 存</button>&nbsp;
			<button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"><i class="fa fa-reply-all"></i>关 闭 </button>
		</div>
	</div>-->
	<script type="text/javascript">
		var prefix ="dataMeter";
		function submitHandler() {
	        if ($.validate.form()) {
				add();
	        }
	    }

		function add() {
			var name = $("input[name='name']").val();
			var type = $("select[name='type']").val();
			var bsDate = $("input[name='bsDate']").val();
			var sxDate = $("input[name='sxDate']").val();
			var version = $("input[name='version']").val();
			var concat = $("input[name='concat']").val();
			var sign = $("input[name='sign']").val();
			var fuWuQi = $("textarea[name='fuWuQi']").val();
			$.ajax({
				cache : true,
				type : "POST",
				url :   "addSave?status=1",
				data : {
					"name": name,
					"type": type,
					"bsDate": bsDate,
					"sxDate": sxDate,
					"version": version,
					"concat": concat,
					"sign": sign,
					"fuWuQi": fuWuQi
				},
				async : false,
				error : function(request) {
					$.modal.alertError("系统错误");
				},
				success : function(data) {
					$.operate.successCallback(data);
				}
			});
		}
	</script>
</body>
</html>
