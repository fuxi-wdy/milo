<script>

function tuichu(){
    $.get(ctx + 'login/logout', function(result) {
        if (result.code == web_status.SUCCESS) {
            window.location.href = ctx + "login";
        }
    })
}

// 默认激活页签（首页）
function tabActive() {
    var $mainTab = $('.menuTab[data-id="' + ctx + 'api/sy"]');
    $mainTab.addClass('active');
    // 懒加载：首次激活首页时才设置 src 并显示
    var $mainIframe = $('.mainContent .RuoYi_iframe[data-id="' + ctx + 'api/sy"]');
    if ($mainIframe.length) {
        openToCurrentTab($mainIframe[0]);
    }
}

$(function() {
    var lockPath = storage.get('lockPath');
    if($.common.equals("history", mode) && window.performance.navigation.type == 1) {
        var url = storage.get('publicPath');
        if ($.common.isNotEmpty(url)) {
        } else {
            tabActive();
        }
    } else if($.common.isNotEmpty(lockPath)) {
        applyPath(lockPath);
        storage.remove('lockPath');
    } else {
        var hash = location.hash;
        if ($.common.isNotEmpty(hash)) {
            var url = hash.substring(1, hash.length);
            applyPath(url);
        } else {
            if($.common.equals("history", mode)) {
                storage.set('publicPath', "");
            }
            tabActive();
        }
    } // <-- 这里缺少了这个闭合大括号
});








/* 切换主题 */
function switchSkin() {
    layer.open({
		type : 2,
		shadeClose : true,
		title : "切换主题",
		area : ["530px", "386px"],
		content : [ctx + "system/switchSkin", 'no']
	})
}

/* 切换菜单 */
function toggleMenu() {
	$.modal.confirm("确认要切换成横向菜单吗？", function() {
		$.get(ctx + 'system/menuStyle/topnav', function(result) {
            window.location.reload();
	    });
	})
}
